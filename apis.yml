aid: advisr
name: Advisr
description: >-
  Advisr is a New York-based sales operating system built for the media and
  advertising industry. Its platform helps broadcast, publishing, cable and
  agency sales teams plan campaigns, match products to advertiser goals and
  budgets, dynamically generate client-ready proposals and presentations,
  automate collaboration and approval workflows, and forecast revenue from
  real-time dashboards. Advisr publishes a public, read-oriented REST API at
  https://api.advisr.com/v1 covering companies, groups, clients, agencies,
  campaigns, products, users, industries and categories, goals, files, bulk
  exports and custom fields, documented as a static HTML reference at
  https://apidocs.advisr.com. Access tokens are issued by Advisr support rather
  than self-service.

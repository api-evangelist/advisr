  image: https://cdn.prod.website-files.com/63e3bd34df9e1947a4fd9a7a/63e99a7ce0068292ab161dba_advisr-icon.png
  description: >-
    The Advisr REST API exposes the objects inside the Advisr Platform —
    company, groups, clients, agencies, campaigns (including product summary
    and detail, product recommendations, geo, audience, presentation, files,
    exports and support/fulfillment submissions), products and sub-products,
    users, industries and industry categories, goals, files, asynchronous bulk
    exports, and read/write custom fields. All responses are JSON. Requests are
    authenticated with a company-scoped access token sent in a `token` request
    header; tokens are issued by an Advisr support representative rather than
    through self-service signup.

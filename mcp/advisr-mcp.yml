agent_safety_notes:
  - >-
    43 of 45 candidate tools are read-only. The three custom-field writes are
    destructive and irreversible; a server should gate them behind explicit
    confirmation and snapshot the object's customFields first.
  - >-
    Auth is a single company-scoped token with no scopes, so a server cannot
    issue a read-only credential — an agent given the token can write.

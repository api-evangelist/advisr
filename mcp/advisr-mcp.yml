source: >-
  DERIVED. Advisr ships no MCP server. Searched the API reference, advisr.com,
  the advisr-io GitHub organisation and the npm registry, and probed
  https://api.advisr.com/mcp and https://api.advisr.com/v1/mcp with a
  tools/list JSON-RPC POST (both HTTP 404); mcp.advisr.com does not resolve in
  DNS. The tool list below is a CANDIDATE we derived from the operations Advisr
  documents at https://apidocs.advisr.com/ — it is a proposal for what an Advisr
  MCP server could expose, not a description of anything that exists.
description: >-
  Candidate MCP tool surface for the Advisr API. Advisr's API is almost entirely
  read-only over a well-shaped domain graph (campaigns, clients, agencies,
  products, users, goals), which is a good fit for an agent tool surface: an
  agent could answer "what campaigns are open for this advertiser and what did
  we recommend" without any write risk. The four mutating operations are
  segregated below and marked destructive.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: api-key
  verified: probed
  note: >-
    mode: none — nobody ships an Advisr MCP server, hosted or stdio. `auth`
    records what such a server would need (the company-scoped `token` header),
    not an auth flow that exists today.
probes:
  - url: https://api.advisr.com/mcp
    method: 'POST tools/list'
    status: 404
  - url: https://api.advisr.com/v1/mcp
    method: 'POST tools/list'
    status: 404
  - url: https://mcp.advisr.com/mcp
    method: 'POST tools/list'
    status: 0
    note: DNS does not resolve.

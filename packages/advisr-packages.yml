observations:
  - >-
    Every @advisr npm package is a fork of an upstream open-source library. The
    scope exists to pin internal build dependencies, not to distribute an SDK.
  - >-
    Seven of the nine were last published in 2022–2023; the most recent release
    across the whole scope is 2025-07-18. None tracks the API, so package
    currency is not an API-decay signal here.
recommendation_to_provider: >-
  Publish an OpenAPI for https://api.advisr.com/v1 and generate a JavaScript and
  a Python client from it. The reference is complete enough to generate one
  today; the absence of any client library is the single largest integration
  cost Advisr currently passes to its customers and fulfillment partners.

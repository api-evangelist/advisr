description: >-
  FINDING: Advisr publishes NO client SDK for its API, in any language. There is
  no SDK section in the API reference, no client library in the advisr-io GitHub
  organisation (17 public repos, none an API client), and nothing on PyPI,
  RubyGems, crates.io, Packagist, Maven Central or NuGet. The nine packages
  under the `@advisr` npm scope listed below ARE first-party — Advisr published
  them — but every one is an internal fork of a third-party library
  (PPTX/Excel generation, Vue map and icon components, a Passport OAuth
  strategy). None of them wraps, calls or documents the Advisr API, so this file
  records them as first-party packages and NOT as SDKs, and no `SDKs` pointer is
  emitted for this provider.
